project:
  title: Future self continuity
  type: website
  output-dir: docs

  render:
    - "!manuscript"
    - "**/*.qmd"

  preview:
    port: 66
    browser: true
    watch-inputs: false
    navigate: true

execute:
  freeze: auto  # Re-render only when source changes

website:
  repo-url: "https://github.com/C-Monaghan/filthy-fowl"
  repo-actions: [edit, issue]

  page-navigation: true

  navbar:
    pinned: true
    background: dark
    search: false

    left:
      - text: Preregistration
        file: analysis/preregistration.qmd
      - text: Models
        file: analysis/models.qmd
      - text: Results
        file: analysis\meta.qmd
      - text: Manuscript
        file: analysis/manuscript.qmd
    right:
      - icon: github
        aria-label: github
        href: https://github.com/C-Monaghan/marigold-mailbox

  page-footer:
    left:  |
      Content {{< fa brands creative-commons >}} 2026 by Cormac Monaghan and Fuschia Sirois<br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution 4.0 International Public License (CC BY 4.0)](https://creativecommons.org/licenses/by/4.0/deed.en)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}}
      GitHub](https://github.com/C-Monaghan/filthy-fowl)

format:
  html:
    shift-heading-level-by: 1
    theme:
      - cosmos
      - html/theme.scss
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: On this page
    code-tools: true
    code-copy: true
    highlight-style: monokai
    smooth-scroll: true
